<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鹈鹕骑车</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one full-bleed SVG stage; a frosted control dock floats bottom-centre, a small title tag sits top-left. */
:root {
  --stage: #8bc7ec;
  --ink: #f8fafc;
  --ink-dim: rgba(248, 250, 252, .8);
  --glass: rgba(14, 28, 46, .42);
  --glass-line: rgba(255, 255, 255, .22);
  --glass-hover: rgba(255, 255, 255, .16);
  --accent: #ffd35a;
  --shade: rgba(8, 22, 42, .34);
  --font-ui: "Fredoka", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-title: "ZCOOL KuaiLe", "Fredoka", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#scene .hit, #rig { cursor: pointer; }
.decal { font-family: var(--font-title); font-size: 7.6px; letter-spacing: 1px; }
@keyframes tw { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }
.tw { animation: tw var(--d, 3s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
#scene.paused .tw { animation-play-state: paused; }
.lampK { opacity: var(--lampK, 0); }
.starK { opacity: var(--starK, 0); }

.tag { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); pointer-events: none; text-shadow: 0 1px 12px var(--shade); }
.tag h1 { margin: 0; font-family: var(--font-title); font-weight: 400; font-size: 30px; line-height: 1.1; letter-spacing: .08em; }
.tag p { margin: 5px 0 0; font-size: 13px; font-weight: 500; color: var(--ink-dim); font-variant-numeric: tabular-nums; letter-spacing: .03em; }

.dock {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px;
  padding: 5px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 10px 30px var(--shade);
  transition: opacity .6s ease, transform .6s ease;
  max-width: calc(100% - 32px); box-sizing: border-box;
}
.dock.idle { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.btn {
  appearance: none; -webkit-appearance: none; border: 0; margin: 0; padding: 0;
  width: 42px; height: 42px; border-radius: 50%; flex: none;
  background: transparent; color: var(--ink); cursor: pointer;
  display: grid; place-items: center; transition: background .2s, transform .15s;
}
.btn:hover { background: var(--glass-hover); }
.btn:active { transform: scale(.9); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn svg { width: 22px; height: 22px; display: block; }
.sep { width: 1px; height: 24px; background: var(--glass-line); margin: 0 4px; flex: none; }
.speed { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; font-size: 13px; color: var(--ink-dim); }
.speed .lab { flex: none; font-weight: 500; }
.kmh { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; min-width: 66px; text-align: right; color: var(--ink); white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 118px; height: 26px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--fill, 41%), var(--glass-line) var(--fill, 41%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); margin-top: -7px; box-shadow: 0 1px 5px var(--shade); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--glass-line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 5px var(--shade); }
input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.hint {
  position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; pointer-events: none;
  text-shadow: 0 1px 8px var(--shade); transition: opacity 1.2s ease; letter-spacing: .04em;
}
.hint.gone { opacity: 0; }
@media (max-width: 600px) {
  .kmh { display: none; }
  input[type=range] { width: 82px; }
  .btn { width: 38px; height: 38px; }
  .tag h1 { font-size: 24px; }
  .hint { display: none; }
}
@media (hover: none) { .hint { display: none; } }
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只围着红围巾的白鹈鹕，骑着薄荷绿复古单车，沿着海边木栈道前进"></svg>

<div class="tag"><h1>鹈鹕骑车</h1><p id="odo">今日里程 0.00 km</p></div>
<div class="hint" id="hint">空格 暂停 · ← → 调速 · B 按铃 · F 吃鱼 · J 跳 · N 昼夜 · 也可以点鹈鹕和单车</div>

<div class="dock" id="dock" role="toolbar" aria-label="动画控制">
  <button class="btn" id="bPlay" type="button" aria-label="暂停" title="暂停（空格）"></button>
  <div class="speed">
    <span class="lab" aria-hidden="true">慢</span>
    <input type="range" id="speed" min="0.3" max="2" step="0.05" value="1" aria-label="骑行速度">
    <span class="lab" aria-hidden="true">快</span>
    <span class="kmh" id="kmh">11.0 km/h</span>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn" id="bBell" type="button" aria-label="按铃" title="按铃（B）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5c.9-1 1.3-2.4 1.3-4.6a4.7 4.7 0 0 1 9.4 0c0 2.2.4 3.6 1.3 4.6z"/><path d="M10.2 19.2a2 2 0 0 0 3.6 0"/><path d="M12 5.4V4"/><path d="M19.5 7.5c.8.9 1.2 2 1.3 3.2M4.5 7.5c-.8.9-1.2 2-1.3 3.2"/></svg>
  </button>
  <button class="btn" id="bFish" type="button" aria-label="让鹈鹕吃一条鱼" title="吃条鱼（F）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.6-3.6 6-5.2 9.4-5.2 3.6 0 6.3 2 8.1 5.2-1.8 3.2-4.5 5.2-8.1 5.2C9 17.2 5.6 15.6 3 12z"/><path d="M3 12 1.2 8.6M3 12l-1.8 3.4"/><circle cx="16.4" cy="11" r=".9" fill="currentColor"/><path d="M12.6 8.6c.8 1 .8 5.8 0 6.8"/></svg>
  </button>
  <button class="btn" id="bNight" type="button" aria-label="切换到夜晚" title="昼夜切换（N）"></button>
</div>

<script>
(() => {
'use strict';
if (!document.documentElement.lang) document.documentElement.lang = 'zh-CN';
/* =========================================================================

   ========================================================================= */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('scene');
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
const r2 = n => Math.round(n * 100) / 100;
const mod = (a, n) => ((a % n) + n) % n;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(20261127);
const rr = (a, b) => a + (b - a) * rand();

const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const F = (x, y, a) => ({ x, y, a, c: Math.cos(a), s: Math.sin(a) });

function bez(a, b, c, d, t) { const u = 1 - t, A = u * u * u, B = 3 * u * u * t, C = 3 * u * t * t, D = t * t * t; return [A * a[0] + B * b[0] + C * c[0] + D * d[0], A * a[1] + B * b[1] + C * c[1] + D * d[1]]; }
function bezD(a, b, c, d, t) { const u = 1 - t; return [3 * u * u * (b[0] - a[0]) + 6 * u * t * (c[0] - b[0]) + 3 * t * t * (d[0] - c[0]), 3 * u * u * (b[1] - a[1]) + 6 * u * t * (c[1] - b[1]) + 3 * t * t * (d[1] - c[1])]; }
function through(pts, cmd) {            // smooth curve through points (quadratic mid-point chain)
  let d = cmd + P(pts[0]);
  for (let i = 1; i < pts.length - 1; i++) d += 'Q' + P(pts[i]) + ' ' + P([(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2]);
  return d + 'L' + P(pts[pts.length - 1]);
}
const attr = (e, k, v) => e.setAttribute(k, v);

/* =========================================================================

  wood1: ['#c68c57'], wood2: ['#b98049'], wood3: ['#d09863'], wood4: ['#be8550'], seam: ['#7c4f2f'],
  fascia: ['#8e5b36'], fasciaHi: ['#c08b59'], post: ['#6c4327'], postHi: ['#8c5a35'], brace: ['#5e3a22'],
  lamp: ['#2c4747'], lampHi: ['#4f706d'], brass: ['#c9a24a'], glass: ['#f3e6bd'],

  umbA: ['#ef5d5d'], umbB: ['#ffffff'], umbC: ['#ffb84d'], umbD: ['#3ca6cf'], umbE: ['#7ac276'], pole: ['#ece6da'],
  towel1: ['#5bb6d6'], towel2: ['#ffcf5c'], towel3: ['#f28fa6'],

const TINT = {
  dusk: { mul: [0.97, 0.8, 0.76], add: [0.035, 0, 0.03] }, duskFg: { mul: [1, 0.88, 0.84], add: [0.02, 0, 0.01] },

{

function applyTheme(k) {
  if (Math.abs(k - themeK) < 0.0015) return;
  themeK = k;
  const st = svg.style;
  for (const key in THEME) {
    const [a, b, c] = THEME[key];

/* =========================================================================

function gearPath(rRoot, rTip, n) {
  let d = '';
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, w = TAU / n;
    for (const [r, t] of [[rRoot, a], [rTip, a + w * .24], [rTip, a + w * .5], [rRoot, a + w * .74]]) d += (d ? 'L' : 'M') + r2(r * Math.cos(t)) + ',' + r2(r * Math.sin(t));
  }
  return d + 'Z';
}
const circ = r => `M${r},0A${r},${r} 0 1 0 ${-r},0A${r},${r} 0 1 0 ${r},0Z`;
function arc(c, r, a1, a2) { const p1 = dir(a1, r, c), p2 = dir(a2, r, c); return `M${P(p1)}A${r},${r} 0 ${(a2 - a1) > 180 ? 1 : 0} 1 ${P(p2)}`; }

/* chain loop: external tangents between chainring (BB) and cog (RA) */
const CHAIN = (() => {
  const dx = RA[0] - BB[0], dy = RA[1] - BB[1], d = Math.hypot(dx, dy), th = Math.atan2(dy, dx), al = Math.acos((RING_R - COG_R) / d);
  const top = th + al, bot = th - al;
  const t1 = [BB[0] + RING_R * Math.cos(top), BB[1] + RING_R * Math.sin(top)], t2 = [RA[0] + COG_R * Math.cos(top), RA[1] + COG_R * Math.sin(top)];
  const b1 = [BB[0] + RING_R * Math.cos(bot), BB[1] + RING_R * Math.sin(bot)], b2 = [RA[0] + COG_R * Math.cos(bot), RA[1] + COG_R * Math.sin(bot)];
  const ringSweep = mod(bot - top, TAU), cogSweep = mod(top - bot, TAU);
  const dPath = `M${P(t2)}L${P(t1)}A${RING_R},${RING_R} 0 ${ringSweep > Math.PI ? 1 : 0} 1 ${P(b1)}L${P(b2)}A${COG_R},${COG_R} 0 ${cogSweep > Math.PI ? 1 : 0} 1 ${P(t2)}Z`;
  const len = Math.hypot(t1[0] - t2[0], t1[1] - t2[1]) * 2 + RING_R * ringSweep + COG_R * cogSweep;
  const n = Math.round(len / 5.2), per = len / n;
  return { d: dPath, per, dash: `${r2(per * 0.46)} ${r2(per * 0.54)}` };
})();

  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.05);
}
function audio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return true; } catch (e) { return false; } }
function ringBell() {
  if (S.paused) setPaused(false);
  S.bellT = S.t;
  if (audio()) { const t = actx.currentTime + 0.01; ding(t, 0.16); ding(t + 0.17, 0.13); }
}
function feed() {
  if (S.paused) setPaused(false);
  if (S.gag) return;
  startGag();
  if (audio()) { const t = actx.currentTime; blip(t + GAG_LAND + 0.03, 420, 160, 0.16, 0.22); blip(t + 2.2, 300, 120, 0.22, 0.16); }
}
function jump() {
  if (S.paused) setPaused(false);
  const { g, v0 } = hopParams(62);
  if (hop(g, v0) && audio()) { const t = actx.currentTime; blip(t, 190, 520, 0.2, 0.14); blip(t + 2 * v0 / g, 140, 70, 0.12, 0.2); }
}
function clap() {
  if (S.paused) setPaused(false);
  if (S.gag) return;
  S.clapT = S.t;
  if (audio()) { const t = actx.currentTime; blip(t, 900, 500, 0.05, 0.12); blip(t + 0.2, 900, 500, 0.05, 0.12); }
}

/* =========================================================================
   UI
   ========================================================================= */
const ICON = {
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8c0 .8.9 1.3 1.6.9l10-6.4c.6-.4.6-1.4 0-1.8l-10-6.4C8.9 4.3 8 4.8 8 5.6z"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5"/></svg>',
};
const dock = $('dock'), hint = $('hint'), bPlay = $('bPlay'), bNight = $('bNight'), speedIn = $('speed'), kmhEl = $('kmh'), odoEl = $('odo');
function setPaused(p) {
  S.paused = p;
  bPlay.innerHTML = p ? ICON.play : ICON.pause;
  bPlay.setAttribute('aria-label', p ? '播放' : '暂停'); bPlay.title = (p ? '播放' : '暂停') + '（空格）';
  svg.classList.toggle('paused', p);
  wake();
}
function syncNightBtn() {
  const toNight = S.nightTarget < 0.5;
  bNight.innerHTML = toNight ? ICON.moon : ICON.sun;
  bNight.setAttribute('aria-label', toNight ? '切换到夜晚' : '切换到白天');
}
function toggleNight() { S.nightTarget = S.nightTarget < 0.5 ? 1 : 0; syncNightBtn(); }
function syncSpeed() { speedIn.style.setProperty('--fill', r2((+speedIn.value - 0.3) / 1.7 * 100) + '%'); }
function nudge(d) { speedIn.value = clamp(+speedIn.value + d, 0.3, 2); S.targetMul = +speedIn.value; syncSpeed(); }
bPlay.addEventListener('click', () => setPaused(!S.paused));
$('bBell').addEventListener('click', ringBell);
$('bFish').addEventListener('click', feed);
bNight.addEventListener('click', toggleNight);
speedIn.addEventListener('input', () => { S.targetMul = +speedIn.value; syncSpeed(); });
$('bell').addEventListener('click', e => { e.stopPropagation(); ringBell(); });
$('basketG').addEventListener('click', e => { e.stopPropagation(); feed(); });
$('pelican').addEventListener('click', e => { e.stopPropagation(); clap(); });
$('rig').addEventListener('click', () => jump());
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onBtn = e.target && e.target.tagName === 'BUTTON', onRange = e.target === speedIn;
  if ((e.key === ' ' || e.key === 'Enter') && onBtn) return;
  if (onRange && (e.key.startsWith('Arrow') || e.key === 'Home' || e.key === 'End' || e.key === 'PageUp' || e.key === 'PageDown')) return;
  switch (e.key) {
    case ' ': e.preventDefault(); setPaused(!S.paused); break;
    case 'ArrowRight': case 'ArrowUp': e.preventDefault(); nudge(0.1); break;
    case 'ArrowLeft': case 'ArrowDown': e.preventDefault(); nudge(-0.1); break;
    case 'b': case 'B': ringBell(); break;
    case 'f': case 'F': feed(); break;
    case 'n': case 'N': toggleNight(); break;
    case 'j': case 'J': jump(); break;
  }
});
let idleT = 0;
function wake() {
  dock.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (!S.paused && !dock.matches(':focus-within') && !dock.matches(':hover')) dock.classList.add('idle'); }, 3800);
}
['pointermove', 'pointerdown', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));
setTimeout(() => hint.classList.add('gone'), 7000);
addEventListener('resize', () => { layout(); draw(); });
syncSpeed(); syncNightBtn(); setPaused(false);
{ // follow the viewer's light/dark theme live: dark → night ride
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onTheme = () => { const t = document.documentElement.getAttribute('data-theme'), d = t ? t === 'dark' : mq.matches; if ((S.nightTarget > 0.5) !== d) { S.nightTarget = d ? 1 : 0; syncNightBtn(); } };
  if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
if (matchMedia('(prefers-reduced-motion: reduce)').matches) setPaused(true);

let last = performance.now(), uiT = 0;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  if (!S.paused) { step(dt); draw(); }
  else if (S.night !== S.nightTarget) { S.night = S.night < S.nightTarget ? Math.min(S.nightTarget, S.night + dt / 5.5) : Math.max(S.nightTarget, S.night - dt / 5.5); drawWorld(); }
  uiT += dt;
  if (uiT > 0.2) { uiT = 0; kmhEl.textContent = (S.v * UNIT_M * 3.6).toFixed(1) + ' km/h'; odoEl.textContent = '今日里程 ' + (S.scroll * UNIT_M / 1000).toFixed(2) + ' km'; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* test hook: advance the simulation deterministically */
window.__pelican = { jump, S, step: (sec, fps = 60) => { const n = Math.round(sec * fps); for (let i = 0; i < n; i++) step(1 / fps); draw(); }, draw, feed, ringBell, toggleNight, setPaused, layout };
})();
</script>
