<title>鹈鹕骑车</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one full-bleed canvas scene (seaside road at dusk / night); title + live stats top-left; a glass control dock bottom-centre. */
:root {
  --ink: #231f2e;
  --glass: rgba(20, 18, 40, 0.46);
  --glass-line: rgba(255, 244, 228, 0.22);
  --text: #fff7ea;
  --muted: rgba(255, 247, 234, 0.72);
  --accent: #ffb54d;
  --accent-ink: #3a2208;
  --font-display: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: #1a1d3d;
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#scene {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  cursor: pointer;
  touch-action: manipulation;
}
.hud {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  left: max(18px, env(safe-area-inset-left, 0px));
  right: max(18px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: flex; flex-direction: column; gap: 6px;
  text-shadow: 0 1px 2px rgba(30, 10, 40, 0.45), 0 2px 14px rgba(30, 10, 40, 0.45);
}
.hud h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(30px, 5vw, 52px);
  line-height: 1;
  letter-spacing: 0.04em;
  text-wrap: balance;
}
.stats {
  display: flex; flex-wrap: wrap; gap: 4px 18px;
  font-size: 14px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b { color: var(--text); font-weight: 700; font-size: 17px; }
.dock {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 10px 12px;
  padding: 10px 14px;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 18px;
  -webkit-backdrop-filter: blur(12px) saturate(1.3);
  backdrop-filter: blur(12px) saturate(1.3);
  box-shadow: 0 10px 30px rgba(10, 6, 30, 0.25);
}
.speed { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.speed label { letter-spacing: 0.06em; }
#speed { width: 140px; accent-color: var(--accent); }
.dock button {
  font: 500 14px/1 var(--font-body);
  color: var(--text);
  background: rgba(255, 247, 234, 0.1);
  border: 1px solid var(--glass-line);
  border-radius: 999px;
  padding: 9px 15px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 0.15s, transform 0.1s;
}
.dock button:hover { background: rgba(255, 247, 234, 0.2); }
.dock button:active { transform: scale(0.96); }
.dock button:focus-visible, #speed:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dock button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.dock button.primary:hover { background: #ffc46e; }
.dock button[aria-pressed="true"] { background: rgba(255, 247, 234, 0.28); }
.dock svg { width: 16px; height: 16px; flex: none; }
.hint {
  position: fixed;
  right: max(18px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 22px);
  margin: 0; font-size: 12px; color: var(--muted);
  pointer-events: none;
  text-shadow: 0 1px 2px rgba(30, 10, 40, 0.5), 0 1px 8px rgba(30, 10, 40, 0.5);
}
@media (max-width: 640px) {
  .hint { display: none; }
  #speed { width: 110px; }
  .dock { gap: 8px; padding: 9px 10px; }
  .dock button { padding: 8px 12px; }
}
</style>

<canvas id="scene" role="img" aria-label="动画：一只戴条纹围巾的鹈鹕骑着复古自行车，沿着海滨大道一路向前"></canvas>

<header class="hud">
  <h1>鹈鹕骑车</h1>
  <div class="stats" aria-live="off">
    <span>车速 <b id="spd">0</b> km/h</span>
    <span>里程 <b id="dst">0.00</b> km</span>
    <span id="terrainLabel">平路</span>
  </div>
</header>
<p class="hint">点击画面或按空格键按铃 · ← → 调踏频 · N 切换夜景</p>

<div class="dock" role="toolbar" aria-label="动画控制">
  <div class="speed">
    <label for="speed">踏频</label>
    <input type="range" id="speed" min="1" max="10" step="1" value="5">
  </div>
  <button id="bellBtn" class="primary" type="button">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5a1 1 0 0 1 1 1v.6a4.6 4.6 0 0 1 3.6 4.5v2.6l1.2 1.6a.6.6 0 0 1-.5 1H2.7a.6.6 0 0 1-.5-1l1.2-1.6V7.6A4.6 4.6 0 0 1 7 3.1v-.6a1 1 0 0 1 1-1zm-1.6 12h3.2a1.6 1.6 0 0 1-3.2 0z"/></svg>
    按铃
  </button>
  <button id="nightBtn" type="button" aria-pressed="false">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.2 1.3a.5.5 0 0 1 .5.7 5.6 5.6 0 0 0 7.3 7.3.5.5 0 0 1 .7.5A6.9 6.9 0 1 1 6.2 1.3z"/></svg>
    夜景
  </button>
  <button id="pauseBtn" type="button">暂停</button>
</div>

<script>
(() => {
"use strict";
const cvs = document.getElementById("scene");
const ctx = cvs.getContext("2d");
const layer = document.createElement("canvas");
const lc = layer.getContext("2d");

const TAU = Math.PI * 2;
const R = 34;          // wheel radius (units)
const WB = 52;         // half wheelbase
const INK = "#231f2e";
let DISPLAY_FONT = "\"ZCOOL KuaiLe\", sans-serif";
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------- sizing ---------- */
let W = 0, H = 0, DPR = 1, S = 1, bikeSX = 0, baseY = 0, horizonY = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cvs.clientWidth || innerWidth;
  H = cvs.clientHeight || innerHeight;
  for (const c of [cvs, layer]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  S = Math.max(0.55, Math.min(H * 0.4 / 185, W * 0.62 / 205));
  bikeSX = W * (W < 700 ? 0.45 : 0.42);
  baseY = H * 0.7;
  horizonY = H * 0.45;
  scarf.reset = true;
}

/* ---------- world ---------- */
const terrain = x => 20 * Math.sin(x / 310) + 11 * Math.sin(x / 127 + 1.3) + 3 * Math.sin(x / 47 + 0.4);
const wx = sx => X + (sx - bikeSX) / S;
const sy = hw => baseY - (hw - camH) * S;

/* ---------- state ---------- */
let X = 140, v = 0, wheelA = 0, crank = 0.6, pedal = 1, theta = 0, slope = 0;
let camH = terrain(X);
let time = 0, lean = 0.08, bob = 0, hMid = 0;
let speedLevel = 5;
const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let nightTarget = prefersDark ? 1 : 0, night = nightTarget;
let paused = reduceMotion;
const pouch = { y: 0, v: 0 };
let lastBy = null, lastBv = 0;
let bumpT = -9, nextBump = 3, blinkT = -9, nextBlink = 2, bellT = -9, bellText = "叮铃铃！";
let fishWagT = -9;
let scarfAnchor = null, rearContact = null, bubbleAnchor = null, headlight = null, taillight = null;
const glows = [];
const particles = [];
const speedLines = [];
const scarf = { tails: [[], []], reset: true };
let jumpFish = null, nextJump = 4;

const stars = Array.from({ length: 140 }, (_, i) => ({ x: hash(i * 3.1), y: hash(i * 7.7) ** 1.4, r: 0.4 + hash(i * 1.9) * 1.3, p: hash(i * 5.3) * TAU }));
const clouds = Array.from({ length: 8 }, (_, i) => ({ u: hash(i * 9.1) * 1.6, y: 0.24 + hash(i * 4.4) * 0.3, s: 0.6 + hash(i * 2.2) * 0.9, n: 4 + Math.floor(hash(i * 6.6) * 3), sp: 0.5 + hash(i) }));
const shimmer = Array.from({ length: 70 }, (_, i) => ({ u: hash(i * 2.7), v: hash(i * 8.3), w: 6 + hash(i * 1.3) * 20, p: hash(i * 4.9) * TAU }));
const gulls = Array.from({ length: 3 }, (_, i) => ({ x: hash(i * 3) * 1, y: 0.12 + hash(i * 5) * 0.18, s: 0.7 + hash(i * 7) * 0.5, p: hash(i * 11) * TAU, vx: 12 + hash(i * 13) * 16 }));

const DAY = {
  skyTop: [66, 98, 160], skyMid: [236, 158, 150], skyLow: [255, 210, 158],
  cloud: [255, 226, 208], cloudShade: [240, 166, 150], sunGlow: [255, 214, 150]
};
const NIGHT = {
  skyTop: [7, 10, 34], skyMid: [28, 32, 82], skyLow: [78, 62, 118],
  cloud: [62, 64, 110], cloudShade: [38, 40, 80], sunGlow: [150, 140, 220]
};

/* ---------- audio ---------- */
let actx = null;
function playBell() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const now = actx.currentTime;
    const master = actx.createGain(); master.gain.value = 0.32; master.connect(actx.destination);
    [0, 0.17].forEach(off => {
      [[2093, 0.5], [2093 * 2.76, 0.18], [2093 * 5.4, 0.06], [2093 * 1.51, 0.12]].forEach(([f, g]) => {
        const o = actx.createOscillator(), gn = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        gn.gain.setValueAtTime(0.0001, now + off);
        gn.gain.exponentialRampToValueAtTime(g, now + off + 0.004);
        gn.gain.exponentialRampToValueAtTime(0.0001, now + off + 1.1);
        o.connect(gn).connect(master);
        o.start(now + off); o.stop(now + off + 1.2);
      });
    });
  } catch (e) { /* audio unavailable: the visual bell still plays */ }
}
const BELL_LINES = ["叮铃铃！", "借过借过～", "叮铃铃！", "嘎——！", "海风真舒服", "叮铃铃！"];
let bellIdx = 0;
function ringBell() {
  bellT = time;
  bellText = BELL_LINES[bellIdx++ % BELL_LINES.length];
  fishWagT = time;
  playBell();
  if (paused) render();
}

/* ---------- simulation ---------- */
function update(dt) {
  time += dt;
  const hr = terrain(X - WB) + R, hf = terrain(X + WB) + R;
  theta = Math.atan2(hf - hr, WB * 2);
  slope = Math.tan(theta);
  const vT = 90 + speedLevel * 44;
  const target = Math.max(55, vT * (1 - 1.9 * slope));
  v += (target - v) * Math.min(1, dt * 0.8);
  const d = v * dt;
  X += d; wheelA += d / R;

  const coast = slope < -0.07;
  pedal += ((coast ? 0 : 1) - pedal) * Math.min(1, dt * 4);
  if (!coast) crank += d / R / 1.8;
  else {
    const tgt = Math.ceil(crank / Math.PI - 0.02) * Math.PI;
    crank += Math.min(Math.max(0, tgt - crank), dt * 3);
  }

  hMid = (hr + hf) / 2;
  camH += (hMid - R - camH) * Math.min(1, dt * 3);
  bob = Math.sin(crank * 2) * 1.3 * pedal;
  const leanT = 0.07 + 0.06 * (speedLevel / 10) * pedal + slope * 0.9;
  lean += (leanT - lean) * Math.min(1, dt * 3);

  // bumps in the road
  if (time > nextBump) {
    bumpT = time; nextBump = time + 2 + Math.random() * 4;
    pouch.v += 38; fishWagT = time;
    if (rearContact) for (let i = 0; i < 6; i++) spawnDust(1.8);
  }
  const bt = time - bumpT;
  const bumpY = bt < 0.6 ? -Math.exp(-bt * 9) * Math.sin(bt * 38) * 1.4 : 0;

  // jiggly pouch: damped spring driven by body acceleration
  const by = -hMid + bob + bumpY;
  if (lastBy === null) lastBy = by;
  const bv = (by - lastBy) / dt;
  const ba = clamp((bv - lastBv) / dt, -4000, 4000);
  lastBy = by; lastBv = bv;
  pouch.v += (-150 * pouch.y - 6.5 * pouch.v - ba * 0.022) * dt;
  pouch.y = clamp(pouch.y + pouch.v * dt, -5, 8);
  state.bumpY = bumpY;

  if (time > nextBlink) { blinkT = time; nextBlink = time + 2.2 + Math.random() * 3.5; }

  // dust behind the rear wheel
  if (rearContact && !reduceMotion && Math.random() < dt * (v / 60)) spawnDust(1);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += (p.vx - v * S) * dt; p.y += p.vy * dt; p.vy -= 10 * dt; p.r += dt * 6 * S;
  }

  // speed lines
  if (!reduceMotion && v > 340 && Math.random() < dt * (v - 300) / 25) {
    speedLines.push({ x: W + 20, y: horizonY * (0.35 + Math.random() * 0.9), len: 40 + Math.random() * 90, life: 1 });
  }
  for (let i = speedLines.length - 1; i >= 0; i--) {
    const l = speedLines[i];
    l.x -= v * S * 2.2 * dt; l.life -= dt * 0.9;
    if (l.x + l.len < -20 || l.life <= 0) speedLines.splice(i, 1);
  }

  // leaping fish out at sea
  if (!jumpFish && time > nextJump) {
    jumpFish = { x: W * (0.55 + Math.random() * 0.4), t: 0, h: 30 + Math.random() * 25, splash: [] };
  }
  if (jumpFish) {
    jumpFish.t += dt;
    jumpFish.x -= v * S * 0.08 * dt;
    if (jumpFish.t > 2.2) { jumpFish = null; nextJump = time + 5 + Math.random() * 7; }
  }

  for (const g of gulls) {
    g.x -= (g.vx + v * 0.05) * dt / Math.max(W, 1) * 3;
    if (g.x < -0.1) { g.x = 1.1; g.y = 0.1 + Math.random() * 0.2; }
  }

  updateScarf(dt);
}
const state = { bumpY: 0 };

function spawnDust(k) {
  particles.push({
    x: rearContact.x - 4 * S, y: rearContact.y - 1,
    vx: (-20 - Math.random() * 30) * S * k, vy: (-8 - Math.random() * 14) * S * k,
    r: (1.2 + Math.random() * 1.8) * S, life: 0.7 + Math.random() * 0.5, max: 1.2
  });
}

function updateScarf(dt) {
  if (!scarfAnchor) return;
  const N = 11;
  const lens = [5.3 * S, 4.4 * S];
  if (scarf.reset || scarf.tails[0].length !== N) {
    scarf.tails = lens.map(L => Array.from({ length: N }, (_, i) => {
      const x = scarfAnchor.x - i * L, y = scarfAnchor.y + i * L * 0.3;
      return { x, y, px: x, py: y };
    }));
    scarf.reset = false;
  }
  const sub = 3, h = Math.min(dt, 0.05) / sub;
  const g = 560 * S;
  const wind = Math.pow(v / 300, 1.3) * g * 1.55;
  for (let s = 0; s < sub; s++) {
    scarf.tails.forEach((tail, k) => {
      const L = lens[k];
      for (let i = 1; i < N; i++) {
        const p = tail[i];
        const vx = (p.x - p.px) * 0.985, vy = (p.y - p.py) * 0.985;
        p.px = p.x; p.py = p.y;
        const f = i / N;
        const flutter = Math.sin(time * 13 + i * 0.85 + k * 2.1) * wind * (0.35 + f * 0.6);
        p.x += vx - wind * (0.75 + 0.35 * f) * h * h;
        p.y += vy + (g * (1 - 0.25 * k) + flutter) * h * h;
      }
      tail[0].x = scarfAnchor.x + k * 1.5 * S; tail[0].y = scarfAnchor.y + k * 1.2 * S;
      for (let it = 0; it < 5; it++) {
        for (let i = 1; i < N; i++) {
          const a = tail[i - 1], b = tail[i];
          const dx = b.x - a.x, dy = b.y - a.y, dd = Math.hypot(dx, dy) || 1e-4;
          const diff = (dd - L) / dd;
          if (i === 1) { b.x -= dx * diff; b.y -= dy * diff; }
          else { a.x += dx * diff * 0.5; a.y += dy * diff * 0.5; b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5; }
        }
      }
    });
  }
}

/* ---------- helpers ---------- */
function cap(c, x, y) {
  const p = c.getTransform().transformPoint(new DOMPoint(x, y));
  return { x: p.x / DPR, y: p.y / DPR };
}
function ik(hx, hy, tx, ty, l1, l2) {
  const dx = tx - hx, dy = ty - hy;
  let d = Math.hypot(dx, dy);
  d = clamp(d, Math.abs(l1 - l2) + 0.01, l1 + l2 - 0.01);
  const a = Math.atan2(dy, dx);
  const A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const ang = a - A; // knee bends forward
  return [hx + Math.cos(ang) * l1, hy + Math.sin(ang) * l1];
}
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
function inked(c, fill, lw = 1.3) {
  c.fillStyle = fill; c.fill();
  c.lineWidth = lw; c.strokeStyle = INK; c.stroke();
}
function tube(c, pts, w, color, inkW = 1.6) {
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.lineCap = "round"; c.lineJoin = "round";
  c.lineWidth = w + inkW * 2; c.strokeStyle = INK; c.stroke();
  c.lineWidth = w; c.strokeStyle = color; c.stroke();
}

/* ---------- sky (main ctx) ---------- */
function drawSky(c) {
  const P = {};
  for (const k in DAY) P[k] = mixc(DAY[k], NIGHT[k], night);
  const g = c.createLinearGradient(0, 0, 0, horizonY);
  g.addColorStop(0, rgb(P.skyTop)); g.addColorStop(0.62, rgb(P.skyMid)); g.addColorStop(1, rgb(P.skyLow));
  c.fillStyle = g; c.fillRect(0, 0, W, horizonY + 2);

  if (night > 0.02) {
    for (const s of stars) {
      const a = night * (0.55 + 0.45 * Math.sin(time * 2.2 + s.p)) * (1 - s.y * 0.6);
      c.fillStyle = `rgba(255,248,230,${a})`;
      c.beginPath(); c.arc(s.x * W, s.y * horizonY * 0.9, s.r, 0, TAU); c.fill();
    }
  }

  // sun setting / moon rising
  const sunX = W * 0.74, sunY = lerp(horizonY - H * 0.055, horizonY + H * 0.12, night);
  const sunR = Math.max(26, H * 0.06);
  const glow = c.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 5);
  glow.addColorStop(0, rgb(P.sunGlow, 0.75 * (1 - night)));
  glow.addColorStop(1, rgb(P.sunGlow, 0));
  c.fillStyle = glow; c.fillRect(0, 0, W, horizonY);
  c.fillStyle = rgb(mixc([255, 240, 200], [255, 160, 120], night));
  c.beginPath(); c.arc(sunX, sunY, sunR, 0, TAU); c.fill();

  const moonX = W * 0.2, moonY = lerp(horizonY + 40, horizonY * 0.3, night), moonR = Math.max(16, H * 0.032);
  if (night > 0.01) {
    const mg = c.createRadialGradient(moonX, moonY, moonR, moonX, moonY, moonR * 6);
    mg.addColorStop(0, `rgba(220,225,255,${0.35 * night})`); mg.addColorStop(1, "rgba(220,225,255,0)");
    c.fillStyle = mg; c.fillRect(0, 0, W, horizonY);
    c.save();
    c.beginPath(); c.arc(moonX, moonY, moonR, 0, TAU); c.clip();
    c.fillStyle = `rgba(250,246,226,${night})`; c.fillRect(moonX - moonR, moonY - moonR, moonR * 2, moonR * 2);
    c.fillStyle = `rgba(200,196,180,${0.5 * night})`;
    [[-0.3, -0.2, 0.22], [0.25, 0.3, 0.16], [0.1, -0.45, 0.1]].forEach(([dx, dy, r]) => {
      c.beginPath(); c.arc(moonX + dx * moonR, moonY + dy * moonR, r * moonR, 0, TAU); c.fill();
    });
    c.restore();
  }

  // clouds
  for (const cl of clouds) {
    const span = W * 1.6;
    let x = ((cl.u * span - X * S * 0.035 - time * 6 * cl.sp) % span + span) % span - W * 0.3;
    const y = cl.y * horizonY, s = cl.s * Math.max(0.7, S * 0.8);
    const puffs = [];
    for (let i = 0; i < cl.n; i++) {
      const t = i / (cl.n - 1);
      puffs.push([x + (t - 0.5) * 90 * s, y - Math.sin(t * Math.PI) * 14 * s - hash(i + cl.u * 10) * 6 * s, (12 + Math.sin(t * Math.PI) * 14) * s]);
    }
    c.fillStyle = rgb(P.cloudShade, 0.9);
    c.beginPath(); for (const [px, py, r] of puffs) { c.moveTo(px + r, py + 5 * s); c.arc(px, py + 5 * s, r, 0, TAU); } c.fill();
    c.fillStyle = rgb(P.cloud, 0.95);
    c.beginPath(); for (const [px, py, r] of puffs) { c.moveTo(px + r, py); c.arc(px, py, r * 0.92, 0, TAU); } c.fill();
  }
  return { sunX, sunY, moonX, moonY };
}

/* ---------- world (layer) ---------- */
function drawSea(c, sky) {
  const g = c.createLinearGradient(0, horizonY, 0, H);
  g.addColorStop(0, "#f2b08e"); g.addColorStop(0.12, "#c99aa6"); g.addColorStop(0.45, "#6f86b4"); g.addColorStop(1, "#4b6a9e");
  c.fillStyle = g; c.fillRect(0, horizonY, W, H - horizonY);

  // distant headland
  c.fillStyle = "#a48fae";
  c.beginPath();
  c.moveTo(0, horizonY);
  const off = X * S * 0.02;
  for (let sx = 0; sx <= W; sx += 10) {
    const u = (sx + off) / 120;
    const hh = Math.max(0, Math.sin(u * 0.7) * 14 + Math.sin(u * 1.9 + 1) * 6 - 6) * Math.max(0.7, S * 0.7);
    c.lineTo(sx, horizonY - hh);
  }
  c.lineTo(W, horizonY); c.closePath(); c.fill();

  // glitter path under the sun
  const beachTop = horizonY + H * 0.1;
  c.save();
  c.globalAlpha = 1 - night;
  for (let i = 0; i < 26; i++) {
    const t = i / 26, yy = lerp(horizonY + 3, beachTop, t);
    const spread = lerp(8, 70, t) * Math.max(0.7, S * 0.6);
    const jitter = Math.sin(time * 3 + i * 1.7) * spread * 0.5;
    c.fillStyle = `rgba(255,236,190,${0.75 - t * 0.4})`;
    c.fillRect(sky.sunX + jitter - spread * 0.3, yy, spread * (0.3 + 0.4 * hash(i + Math.floor(time * 4))), 1.6);
  }
  c.restore();

  for (const s of shimmer) {
    const span = W + 60;
    const x = ((s.u * span - X * S * 0.08) % span + span) % span - 30;
    const y = lerp(horizonY + 6, beachTop - 4, s.v);
    const a = 0.25 + 0.25 * Math.sin(time * 2 + s.p);
    c.fillStyle = `rgba(255,240,225,${a * (0.5 + s.v * 0.5)})`;
    c.fillRect(x, y, s.w * (0.4 + s.v), 1.2);
  }

  // sailboat
  const bspan = 2600;
  const bu = ((900 - X * 0.03) % bspan + bspan) % bspan;
  const bx = bu * S * 0.5 - 100;
  if (bx > -60 && bx < W + 60) {
    const k = Math.max(0.7, S * 0.6), byy = horizonY + 9 * k;
    c.fillStyle = "#5a4a6a";
    c.beginPath(); c.moveTo(bx - 14 * k, byy); c.lineTo(bx + 14 * k, byy); c.lineTo(bx + 10 * k, byy + 4 * k); c.lineTo(bx - 10 * k, byy + 4 * k); c.fill();
    c.fillStyle = "#fff3e2";
    c.beginPath(); c.moveTo(bx, byy - 1); c.lineTo(bx, byy - 26 * k); c.lineTo(bx + 12 * k, byy - 2 * k); c.fill();
    c.fillStyle = "#f6c8a8";
    c.beginPath(); c.moveTo(bx - 1, byy - 2); c.lineTo(bx - 1, byy - 20 * k); c.lineTo(bx - 10 * k, byy - 2 * k); c.fill();
  }

  // leaping fish
  if (jumpFish) {
    const f = jumpFish, t = f.t / 1.1, k = Math.max(0.7, S * 0.6);
    const waterY = lerp(horizonY, beachTop, 0.55);
    if (t < 1) {
      const fx = f.x + (t - 0.5) * 40 * k, fy = waterY - Math.sin(t * Math.PI) * f.h * k;
      const ang = Math.atan2(Math.cos(t * Math.PI) * -f.h, 40) * 0.9;
      c.save(); c.translate(fx, fy); c.rotate(-ang); c.scale(k, k);
      c.fillStyle = "#dfe8f2";
      c.beginPath(); c.ellipse(0, 0, 6, 2.4, 0, 0, TAU); c.fill();
      c.beginPath(); c.moveTo(-5, 0); c.lineTo(-10, -3); c.lineTo(-10, 3); c.fill();
      c.restore();
    }
    for (const [tt, sx] of [[0, -20], [1, 20]]) {
      const age = f.t - tt * 1.1;
      if (age > 0 && age < 1) {
        c.strokeStyle = `rgba(255,255,255,${0.7 * (1 - age)})`; c.lineWidth = 1.2;
        c.beginPath(); c.ellipse(f.x + sx * k, waterY, (4 + age * 18) * k, (1 + age * 3) * k, 0, 0, TAU); c.stroke();
      }
    }
  }

  // gulls
  for (const g2 of gulls) {
    const gx = g2.x * W, gy = g2.y * horizonY + Math.sin(time * 0.8 + g2.p) * 6;
    const flap = Math.sin(time * 7 * g2.s + g2.p);
    const k = Math.max(0.8, S * 0.55) * g2.s;
    c.strokeStyle = "#3b3346"; c.lineWidth = 1.6 * k; c.lineCap = "round";
    c.beginPath();
    c.moveTo(gx - 9 * k, gy - flap * 4 * k);
    c.quadraticCurveTo(gx - 4 * k, gy - 5 * k - flap * 2 * k, gx, gy);
    c.quadraticCurveTo(gx + 4 * k, gy - 5 * k - flap * 2 * k, gx + 9 * k, gy - flap * 4 * k);
    c.stroke();
  }
  return beachTop;
}

function drawBeach(c, beachTop) {
  const p = 0.45, k = S * 0.72;
  const off = X * p;
  const edge = sx => beachTop + Math.sin((sx / S + off) / 70) * 3 * S + Math.sin((sx / S + off) / 23) * 1.2 * S;
  // wet sand + foam
  c.beginPath(); c.moveTo(-10, H);
  for (let sx = -10; sx <= W + 10; sx += 8) c.lineTo(sx, edge(sx) - 3);
  c.lineTo(W + 10, H); c.closePath();
  c.fillStyle = "rgba(255,250,240,0.85)"; c.fill();
  c.beginPath(); c.moveTo(-10, H);
  for (let sx = -10; sx <= W + 10; sx += 8) c.lineTo(sx, edge(sx) + Math.sin(time * 1.6 + sx * 0.03) * 1.2);
  c.lineTo(W + 10, H); c.closePath();
  const g = c.createLinearGradient(0, beachTop, 0, H * 0.75);
  g.addColorStop(0, "#e7c39a"); g.addColorStop(0.2, "#f2d6a6"); g.addColorStop(1, "#e9bf86");
  c.fillStyle = g; c.fill();

  // umbrellas & palms
  const startU = off - bikeSX / S - 200, endU = off + (W - bikeSX) / S + 200;
  const UM = 230;
  const cols = ["#e85d4a", "#2f8f9d", "#f4c542", "#f08a5d", "#6c8fd6"];
  for (let i = Math.floor(startU / UM); i <= Math.ceil(endU / UM); i++) {
    const hsh = hash(i * 1.37);
    const u = i * UM + hsh * 120;
    const sx = bikeSX + (u - off) * S;
    const base = edge(sx) + (14 + hash(i * 3.3) * 16) * S;
    if (hsh < 0.22) { // palm tree
      const hgt = (105 + hash(i * 5.1) * 30) * k, lean2 = (hash(i * 7) - 0.5) * 30 * k;
      c.strokeStyle = INK; c.lineWidth = 7 * k; c.lineCap = "round";
      c.beginPath(); c.moveTo(sx, base); c.quadraticCurveTo(sx + lean2 * 0.2, base - hgt * 0.6, sx + lean2, base - hgt); c.stroke();
      c.strokeStyle = "#9a7458"; c.lineWidth = 5 * k; c.stroke();
      const tx = sx + lean2, ty = base - hgt;
      for (let f = 0; f < 7; f++) {
        const a = -Math.PI / 2 + (f - 3) * 0.5 + Math.sin(time * 1.4 + f + i) * 0.05;
        const len = (34 + (f % 2) * 8) * k;
        const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.5 + len * 0.45;
        c.beginPath(); c.moveTo(tx, ty);
        c.quadraticCurveTo(tx + Math.cos(a) * len * 0.6, ty + Math.sin(a) * len * 0.8 - 6 * k, ex, ey);
        c.strokeStyle = INK; c.lineWidth = 6 * k; c.stroke();
        c.strokeStyle = f % 2 ? "#3f8a5e" : "#4e9c69"; c.lineWidth = 4.2 * k; c.stroke();
      }
      continue;
    }
    if (hsh > 0.8) continue;
    const col = cols[Math.floor(hash(i * 2.9) * cols.length)];
    const tilt = (hash(i * 4.1) - 0.5) * 0.35;
    c.save(); c.translate(sx, base); c.rotate(tilt);
    c.strokeStyle = INK; c.lineWidth = 2 * k;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -36 * k); c.stroke();
    c.beginPath(); c.moveTo(-24 * k, -32 * k); c.quadraticCurveTo(0, -56 * k, 24 * k, -32 * k); c.closePath();
    c.fillStyle = col; c.fill(); c.lineWidth = 1.4 * k; c.stroke();
    c.save(); c.clip();
    c.fillStyle = "#fff6e6";
    for (let sIdx = -2; sIdx <= 2; sIdx += 2) { c.beginPath(); c.moveTo(0, -48 * k); c.lineTo(sIdx * 8 * k - 4 * k, -30 * k); c.lineTo(sIdx * 8 * k + 4 * k, -30 * k); c.fill(); }
    c.restore();
    c.restore();
    // towel
    if (hash(i * 8.8) > 0.5) {
      c.fillStyle = cols[(Math.floor(hash(i) * 5) + 2) % 5];
      c.beginPath(); c.ellipse(sx + 22 * k, base + 2 * k, 14 * k, 3 * k, 0, 0, TAU); c.fill();
    }
  }
}

function drawRoad(c) {
  const step = 6;
  const xs = [];
  for (let sx = -step * 2; sx <= W + step * 2; sx += step) xs.push([sx, terrain(wx(sx))]);
  const band = (top, bot, fill) => {
    c.beginPath();
    xs.forEach(([sx, h], i) => i ? c.lineTo(sx, sy(h + top)) : c.moveTo(sx, sy(h + top)));
    for (let i = xs.length - 1; i >= 0; i--) c.lineTo(xs[i][0], sy(xs[i][1] + bot));
    c.closePath(); c.fillStyle = fill; c.fill();
  };
  const line = (off, color, w) => {
    c.beginPath();
    xs.forEach(([sx, h], i) => i ? c.lineTo(sx, sy(h + off)) : c.moveTo(sx, sy(h + off)));
    c.strokeStyle = color; c.lineWidth = w; c.stroke();
  };
  const x0 = wx(-40), x1 = wx(W + 40);

  // railing along the seawall
  for (let i = Math.floor(x0 / 36); i <= Math.ceil(x1 / 36); i++) {
    const x = i * 36, sx = bikeSX + (x - X) * S, h = terrain(x);
    c.strokeStyle = INK; c.lineWidth = 4.2 * S; c.lineCap = "butt";
    c.beginPath(); c.moveTo(sx, sy(h + 27)); c.lineTo(sx, sy(h + 50)); c.stroke();
    c.strokeStyle = "#f4efe4"; c.lineWidth = 2.6 * S; c.stroke();
  }
  line(48, INK, 4.6 * S); line(48, "#f4efe4", 3 * S);
  line(38, INK, 3 * S); line(38, "#f4efe4", 1.6 * S);

  // promenade paving
  band(28, 12, "#dcc5a2");
  c.strokeStyle = "rgba(120,86,56,0.22)"; c.lineWidth = 1 * S;
  for (let i = Math.floor(x0 / 26); i <= Math.ceil(x1 / 26); i++) {
    const x = i * 26, sx = bikeSX + (x - X) * S, h = terrain(x);
    c.beginPath(); c.moveTo(sx, sy(h + 28)); c.lineTo(sx - 6 * S, sy(h + 12)); c.stroke();
  }
  line(28, "rgba(255,250,240,0.6)", 1.2 * S);

  // lamps and signs on the promenade
  glows.length = 0;
  for (let i = Math.floor((x0 - 100) / 460); i <= Math.ceil((x1 + 100) / 460); i++) {
    const x = i * 460 + 120;
    drawLamp(c, bikeSX + (x - X) * S, sy(terrain(x) + 20));
  }
  for (let i = Math.floor((x0 - 100) / 1700); i <= Math.ceil((x1 + 100) / 1700); i++) {
    const x = i * 1700 + 900;
    drawSign(c, bikeSX + (x - X) * S, sy(terrain(x) + 17));
  }

  // asphalt
  band(12, -18, "#5a5664");
  line(12, "#77727f", 1.6 * S);
  // asphalt specks
  c.fillStyle = "rgba(255,255,255,0.07)";
  for (let i = Math.floor(x0 / 9); i <= Math.ceil(x1 / 9); i++) {
    const x = i * 9, sx = bikeSX + (x - X) * S;
    const yy = terrain(x) + lerp(10, -16, hash(i * 1.7));
    c.fillRect(sx, sy(yy), 1.4 * S, 1.4 * S);
  }
  // centre dashes
  c.strokeStyle = "#f3e2ae"; c.lineWidth = 2.2 * S; c.lineCap = "butt";
  for (let i = Math.floor(x0 / 70); i <= Math.ceil(x1 / 70); i++) {
    const a = i * 70, b = a + 34;
    c.beginPath();
    for (let x = a, j = 0; x <= b; x += 8.5, j++) {
      const sx = bikeSX + (x - X) * S, y = sy(terrain(x) - 6);
      j ? c.lineTo(sx, y) : c.moveTo(sx, y);
    }
    c.stroke();
  }
  // curb + embankment
  band(-18, -23, "#cdb998");
  line(-18, "rgba(255,250,240,0.5)", 1 * S);
  c.beginPath();
  xs.forEach(([sx, h], i) => i ? c.lineTo(sx, sy(h - 23)) : c.moveTo(sx, sy(h - 23)));
  c.lineTo(W + 20, H + 10); c.lineTo(-20, H + 10); c.closePath();
  const gg = c.createLinearGradient(0, baseY, 0, H);
  gg.addColorStop(0, "#8db662"); gg.addColorStop(1, "#4f7c45");
  c.fillStyle = gg; c.fill();
}

function drawLamp(c, sx, by) {
  if (sx < -80 || sx > W + 80) return;
  const k = S, top = by - 158 * k;
  c.lineCap = "round";
  c.fillStyle = "#2f4a46";
  c.beginPath(); c.roundRect ? c.roundRect(sx - 6 * k, by - 10 * k, 12 * k, 12 * k, 2 * k) : c.rect(sx - 6 * k, by - 10 * k, 12 * k, 12 * k);
  c.fill(); c.strokeStyle = INK; c.lineWidth = 1.3 * k; c.stroke();
  c.beginPath(); c.moveTo(sx, by - 8 * k); c.lineTo(sx, top + 10 * k);
  c.bezierCurveTo(sx, top - 8 * k, sx + 22 * k, top - 10 * k, sx + 26 * k, top + 4 * k);
  c.strokeStyle = INK; c.lineWidth = 5 * k; c.stroke();
  c.strokeStyle = "#2f4a46"; c.lineWidth = 3 * k; c.stroke();
  // lantern
  const lx = sx + 26 * k, ly = top + 6 * k;
  c.beginPath();
  c.moveTo(lx - 7 * k, ly); c.lineTo(lx + 7 * k, ly); c.lineTo(lx + 5 * k, ly + 12 * k); c.lineTo(lx - 5 * k, ly + 12 * k); c.closePath();
  c.fillStyle = night > 0.5 ? "#fff1b8" : "#f7e6bd"; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.3 * k; c.stroke();
  c.beginPath(); c.moveTo(lx - 8 * k, ly); c.lineTo(lx, ly - 5 * k); c.lineTo(lx + 8 * k, ly); c.closePath();
  c.fillStyle = "#2f4a46"; c.fill(); c.stroke();
  glows.push({ x: lx, y: ly + 7 * k, ground: by + 16 * k });
}

function drawSign(c, sx, by) {
  if (sx < -120 || sx > W + 120) return;
  const k = S;
  c.strokeStyle = INK; c.lineWidth = 4 * k; c.lineCap = "round";
  c.beginPath(); c.moveTo(sx, by); c.lineTo(sx, by - 92 * k); c.stroke();
  c.strokeStyle = "#9aa3ad"; c.lineWidth = 2.4 * k; c.stroke();
  // round blue bicycle sign
  const cy = by - 92 * k;
  c.beginPath(); c.arc(sx, cy, 17 * k, 0, TAU); inked(c, "#2c6fbf", 1.6 * k);
  c.beginPath(); c.arc(sx, cy, 14.5 * k, 0, TAU); c.strokeStyle = "#ffffff"; c.lineWidth = 1.2 * k; c.stroke();
  c.strokeStyle = "#fff"; c.lineWidth = 1.5 * k;
  c.beginPath(); c.arc(sx - 6 * k, cy + 4 * k, 4.2 * k, 0, TAU); c.stroke();
  c.beginPath(); c.arc(sx + 6 * k, cy + 4 * k, 4.2 * k, 0, TAU); c.stroke();
  c.beginPath(); c.moveTo(sx - 6 * k, cy + 4 * k); c.lineTo(sx - 1 * k, cy - 3 * k); c.lineTo(sx + 4 * k, cy - 3 * k); c.lineTo(sx + 6 * k, cy + 4 * k);
  c.moveTo(sx - 1 * k, cy - 3 * k); c.lineTo(sx, cy + 4 * k); c.lineTo(sx + 4 * k, cy - 3 * k);
  c.moveTo(sx - 3 * k, cy - 5 * k); c.lineTo(sx + 1 * k, cy - 5 * k); c.stroke();
  // plate
  const pw = 62 * k, ph = 18 * k, py = cy + 22 * k;
  c.beginPath(); c.rect(sx - pw / 2, py, pw, ph); inked(c, "#fdf8ee", 1.4 * k);
  c.fillStyle = "#2c6fbf";
  c.font = `${Math.round(11.5 * k)}px ${DISPLAY_FONT}`;
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText("鹈鹕专用道", sx, py + ph / 2 + 0.5 * k);
}

/* ---------- bike + pelican ---------- */
const RH = [-52, 0], FH = [52, 0], BB = [-6, 4], ST = [-21, -38], HTt = [37, -40], HTb = [41, -27];
const SADDLE = [-25, -46], GRIP = [27, -53];
const FRAME = "#2a7f8a", FRAME_D = "#1d5e67", CREAM = "#f2e6cb", CHROME = "#cdd2da";

function drawWheel(c, x, y, ang) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.arc(0, 0, R - 0.5, 0, TAU);
  c.lineWidth = 6.4; c.strokeStyle = INK; c.stroke();
  c.lineWidth = 4.2; c.strokeStyle = "#34303b"; c.stroke();
  c.beginPath(); c.arc(0, 0, R - 2.6, 0, TAU); c.lineWidth = 1; c.strokeStyle = "#d9c79f"; c.stroke();
  c.beginPath(); c.arc(0, 0, R - 4.2, 0, TAU); c.lineWidth = 1.9; c.strokeStyle = CHROME; c.stroke();
  c.rotate(ang);
  const blur = clamp((v - 160) / 420, 0, 1);
  c.globalAlpha = 1 - blur * 0.72;
  c.strokeStyle = "#b5bbc6"; c.lineWidth = 0.55;
  c.beginPath();
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * TAU, b = a + (i % 2 ? 0.42 : -0.42);
    c.moveTo(Math.cos(b) * 3, Math.sin(b) * 3); c.lineTo(Math.cos(a) * (R - 5), Math.sin(a) * (R - 5));
  }
  c.stroke();
  c.globalAlpha = 1;
  if (blur > 0) {
    c.beginPath(); c.arc(0, 0, R - 5, 0, TAU);
    c.fillStyle = `rgba(215,220,230,${0.14 * blur})`; c.fill();
  }
  c.setLineDash([1.6, 4.4]);
  c.beginPath(); c.arc(0, 0, R - 0.6, 0, TAU); c.lineWidth = 1.2; c.strokeStyle = "rgba(255,255,255,0.16)"; c.stroke();
  c.setLineDash([]);
  c.fillStyle = "#8b8f98"; c.fillRect(-0.8, -R + 5, 1.6, 3.2);
  c.beginPath(); c.arc(0, 0, 3.4, 0, TAU); inked(c, "#dde1e7", 0.9);
  c.restore();
}

function fender(c, x, y, a0, a1) {
  c.beginPath(); c.arc(x, y, R + 3.6, a0, a1);
  c.lineCap = "round"; c.lineWidth = 5.2; c.strokeStyle = INK; c.stroke();
  c.lineWidth = 3; c.strokeStyle = CREAM; c.stroke();
}

function drawLeg(c, hip, pedalP, far) {
  const ankle = [pedalP[0] - 2.5, pedalP[1] - 5.2];
  const knee = ik(hip[0], hip[1], ankle[0], ankle[1], 31, 30);
  const shin = far ? "#b8692b" : "#ea913b";
  const thigh = far ? "#c3c4ce" : "#fbfaf7";
  // shin
  tube(c, [knee, ankle], 3.6, shin, 1.3);
  // feathery thigh
  c.beginPath();
  const dx = knee[0] - hip[0], dy = knee[1] - hip[1], L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  c.moveTo(hip[0] + nx * 7, hip[1] + ny * 7);
  c.quadraticCurveTo(hip[0] + dx * 0.6 + nx * 7, hip[1] + dy * 0.6 + ny * 7, knee[0] + nx * 3, knee[1] + ny * 3);
  c.quadraticCurveTo(knee[0] + dx / L * 4, knee[1] + dy / L * 4, knee[0] - nx * 3, knee[1] - ny * 3);
  c.quadraticCurveTo(hip[0] + dx * 0.5 - nx * 6, hip[1] + dy * 0.5 - ny * 6, hip[0] - nx * 7, hip[1] - ny * 7);
  c.closePath();
  inked(c, thigh, 1.3);
  // feather ticks on the thigh
  c.strokeStyle = far ? "rgba(35,31,46,0.25)" : "rgba(35,31,46,0.22)"; c.lineWidth = 0.7;
  c.beginPath();
  for (let t = 0.45; t < 0.95; t += 0.22) {
    const px = hip[0] + dx * t, py = hip[1] + dy * t;
    c.moveTo(px + nx * 4, py + ny * 4); c.lineTo(px + nx * 1 + dx / L * 2.5, py + ny * 1 + dy / L * 2.5);
  }
  c.stroke();
  // webbed foot on the pedal
  const fa = Math.sin(crank + (far ? Math.PI : 0)) * 0.12;
  c.save(); c.translate(pedalP[0], pedalP[1] - 1.6); c.rotate(fa);
  c.beginPath();
  c.moveTo(-2.5, -3.6);
  c.lineTo(8.5, -1.6);
  c.quadraticCurveTo(7.4, 0.4, 8.2, 1.6);
  c.quadraticCurveTo(3, 1, -3.5, 1.2);
  c.closePath();
  inked(c, far ? "#b8692b" : "#f0993f", 1.1);
  c.strokeStyle = "rgba(35,31,46,0.45)"; c.lineWidth = 0.6;
  c.beginPath(); c.moveTo(-1, -2.4); c.lineTo(8.2, -1.4); c.moveTo(-1, -1); c.lineTo(7.9, 0.2); c.stroke();
  c.restore();
}

function crankArm(c, p) {
  tube(c, [BB, p], 1.8, CHROME, 1);
  c.save(); c.translate(p[0], p[1]);
  c.beginPath(); c.rect(-4, -1.3, 8, 2.6); inked(c, "#3a3742", 0.9);
  c.restore();
}

function drawBike(c) {
  const ca = Math.cos(crank) * 12, sa = Math.sin(crank) * 12;
  const pNear = [BB[0] + ca, BB[1] + sa], pFar = [BB[0] - ca, BB[1] - sa];

  // pelican group transform values
  const hipRel = [4, -4 + bob];
  const hr = rot(hipRel[0], hipRel[1], lean);
  const hip = [SADDLE[0] + hr[0], SADDLE[1] + hr[1]];

  // shadow
  c.beginPath(); c.ellipse(0, R + 1, 78, 5, 0, 0, TAU);
  c.fillStyle = "rgba(30,20,40,0.22)"; c.fill();

  // far side: leg, crank
  c.save(); c.globalAlpha = 0.96;
  crankArm(c, pFar);
  drawLeg(c, [hip[0] + 2, hip[1] - 1], pFar, true);
  c.restore();

  drawWheel(c, RH[0], RH[1], wheelA);
  drawWheel(c, FH[0], FH[1], wheelA);
  fender(c, RH[0], RH[1], Math.PI * 0.92, Math.PI * 1.72);
  fender(c, FH[0], FH[1], Math.PI * 1.22, Math.PI * 1.98);

  // chain
  c.save();
  c.setLineDash([1.6, 1.3]); c.lineDashOffset = crank * 9;
  c.strokeStyle = "#45434c"; c.lineWidth = 1.4; c.lineCap = "butt";
  c.beginPath(); c.moveTo(BB[0], BB[1] - 9); c.lineTo(RH[0], RH[1] - 4.4); c.stroke();
  c.lineDashOffset = -crank * 9;
  c.beginPath(); c.moveTo(BB[0], BB[1] + 9); c.lineTo(RH[0], RH[1] + 4.4); c.stroke();
  c.restore();
  c.beginPath(); c.arc(RH[0], RH[1], 4.4, 0, TAU); inked(c, "#9aa0aa", 0.8);

  // frame
  tube(c, [RH, BB, ST, RH], 3.4, FRAME);
  tube(c, [ST, HTt], 3.4, FRAME);
  tube(c, [BB, HTb], 3.8, FRAME);
  // fork
  c.beginPath(); c.moveTo(HTb[0], HTb[1]); c.quadraticCurveTo(43, -9, FH[0], FH[1]);
  c.lineCap = "round"; c.lineWidth = 5.6; c.strokeStyle = INK; c.stroke();
  c.lineWidth = 3; c.strokeStyle = FRAME; c.stroke();
  tube(c, [HTt, HTb], 5, FRAME_D);
  // frame highlight
  c.strokeStyle = "rgba(255,255,255,0.28)"; c.lineWidth = 0.9;
  c.beginPath(); c.moveTo(ST[0] + 3, ST[1] - 1.2); c.lineTo(HTt[0] - 3, HTt[1] - 1.2); c.stroke();
  // seatpost + saddle
  tube(c, [ST, [-24, -44]], 2.2, CHROME, 1);
  c.beginPath();
  c.moveTo(-34, -46.5); c.quadraticCurveTo(-27, -50.5, -14, -46.6);
  c.lineTo(-14.5, -45); c.quadraticCurveTo(-24, -43.2, -34, -43.6); c.closePath();
  inked(c, "#7a4630", 1.1);
  c.strokeStyle = "#3d3a44"; c.lineWidth = 0.8;
  c.beginPath(); for (let i = 0; i < 4; i++) { c.moveTo(-31 + i * 1.6, -43.4); c.lineTo(-30.2 + i * 1.6, -41.6); } c.stroke();

  // basket + fish
  tube(c, [[48, -31], FH], 1, CHROME, 0.7);
  tube(c, [[60, -31], FH], 1, CHROME, 0.7);
  tube(c, [HTt, [46, -38]], 1.6, CHROME, 0.8);
  const wag = time - fishWagT < 0.8 ? Math.sin((time - fishWagT) * 30) * 0.5 * (1 - (time - fishWagT) / 0.8) : Math.sin(time * 1.7) * 0.06;
  c.save(); c.translate(57, -44); c.rotate(-0.45 + wag);
  c.beginPath(); c.moveTo(0, 4); c.quadraticCurveTo(-1.5, -2, 0, -5);
  c.lineTo(-4, -10); c.quadraticCurveTo(0, -8.5, 4, -10.5); c.lineTo(1.8, -5); c.quadraticCurveTo(3, -1, 3, 4); c.closePath();
  inked(c, "#86b9cf", 1);
  c.strokeStyle = "rgba(35,31,46,0.35)"; c.lineWidth = 0.5;
  c.beginPath(); c.moveTo(-2, -9); c.lineTo(0.6, -5.6); c.moveTo(2, -9.6); c.lineTo(1.4, -5.6); c.stroke();
  c.restore();
  c.beginPath();
  c.moveTo(43, -45); c.lineTo(66, -45); c.lineTo(63, -31); c.lineTo(46, -31); c.closePath();
  inked(c, "#cf9a5f", 1.2);
  c.save(); c.clip();
  c.strokeStyle = "#9c6a3a"; c.lineWidth = 0.7;
  c.beginPath();
  for (let yy = -42; yy < -31; yy += 3) { c.moveTo(40, yy); c.lineTo(70, yy); }
  for (let xx = 45; xx < 68; xx += 3.4) { c.moveTo(xx, -46); c.lineTo(xx - 0.8, -30); }
  c.stroke();
  c.restore();
  c.beginPath(); c.moveTo(42, -45.5); c.lineTo(67, -45.5);
  c.lineCap = "round"; c.lineWidth = 3.6; c.strokeStyle = INK; c.stroke(); c.lineWidth = 2; c.strokeStyle = "#b9824b"; c.stroke();
  // headlamp
  c.beginPath(); c.ellipse(66.5, -37.5, 2.6, 3.2, 0, 0, TAU); inked(c, CHROME, 1);
  c.beginPath(); c.ellipse(68.2, -37.5, 1, 2.4, 0, 0, TAU); c.fillStyle = night > 0.4 ? "#fff6cf" : "#f6efd9"; c.fill();
  headlight = { p: cap(c, 69, -37.5), q: cap(c, 300, -37.5 + 30), g: cap(c, 300, R) };
  // taillight on seatpost
  c.beginPath(); c.rect(-27.5, -42, 2.6, 3.4); inked(c, "#d8433b", 0.7);
  taillight = cap(c, -27, -40.3);

  // stem + bars + bell
  tube(c, [HTt, [35, -47]], 2.2, CHROME, 1);
  c.beginPath(); c.moveTo(35, -47); c.bezierCurveTo(42, -49, 38, -54.5, 29, -53);
  c.lineCap = "round"; c.lineWidth = 4.4; c.strokeStyle = INK; c.stroke();
  c.lineWidth = 2.2; c.strokeStyle = CHROME; c.stroke();
  tube(c, [[29, -53], [24, -52.6]], 3, "#2d2a33", 0.8);
  const ring = time - bellT < 0.6 ? Math.sin((time - bellT) * 60) * 0.35 * (1 - (time - bellT) / 0.6) : 0;
  c.save(); c.translate(37, -50); c.rotate(ring);
  c.beginPath(); c.arc(0, -1, 2.6, Math.PI, 0); c.lineTo(2.6, 0.4); c.lineTo(-2.6, 0.4); c.closePath();
  inked(c, "#f0c24a", 0.9);
  c.beginPath(); c.arc(0, -3.8, 0.7, 0, TAU); c.fillStyle = INK; c.fill();
  c.restore();

  // chainring + near crank
  c.beginPath(); c.arc(BB[0], BB[1], 9, 0, TAU);
  c.setLineDash([1.3, 1]); c.lineWidth = 2.2; c.strokeStyle = "#6d717c"; c.stroke(); c.setLineDash([]);
  c.beginPath(); c.arc(BB[0], BB[1], 8, 0, TAU); inked(c, "#b4bac4", 0.9);
  c.save(); c.translate(BB[0], BB[1]); c.rotate(crank);
  c.fillStyle = "#6d717c";
  for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; c.beginPath(); c.arc(Math.cos(a) * 4.6, Math.sin(a) * 4.6, 1.5, 0, TAU); c.fill(); }
  c.restore();

  rearContact = cap(c, RH[0] - 4, R);

  // ---- pelican ----
  drawPelican(c, hip, pNear);
}

function drawPelican(c, hip, pNear) {
  c.save();
  c.translate(SADDLE[0], SADDLE[1]);
  c.rotate(lean);
  c.translate(0, bob);
  // grip position in this frame
  const gr = rot(GRIP[0] - SADDLE[0], GRIP[1] - SADDLE[1], -lean);
  const G = [gr[0], gr[1] - bob];

  // far wing reaching the far grip
  wingArm(c, [G[0] - 2.5, G[1] - 1.5], true);

  // tail
  c.beginPath();
  c.moveTo(-32, -30); c.quadraticCurveTo(-48, -30, -60, -25);
  c.lineTo(-57, -21); c.lineTo(-61, -17.5); c.quadraticCurveTo(-46, -14, -32, -14); c.closePath();
  inked(c, "#f3f1ee", 1.3);
  c.strokeStyle = "rgba(35,31,46,0.35)"; c.lineWidth = 0.7;
  c.beginPath(); c.moveTo(-40, -24); c.lineTo(-56, -22.5); c.moveTo(-40, -19); c.lineTo(-55, -18.5); c.stroke();

  // neck
  const headBob = pouch.y * 0.18 + Math.sin(crank * 2) * 0.5 * pedal;
  const HX = 41, HY = -86 + headBob;
  c.beginPath();
  c.moveTo(24, -34); c.bezierCurveTo(37, -47, 20, -64, HX - 5, HY + 5);
  c.lineCap = "round";
  c.lineWidth = 15.6; c.strokeStyle = INK; c.stroke();
  c.lineWidth = 13; c.strokeStyle = "#fbf8f2"; c.stroke();
  // cream throat wash
  c.beginPath(); c.moveTo(30, -40); c.bezierCurveTo(40, -50, 28, -64, HX - 1, HY + 8);
  c.lineWidth = 3.4; c.strokeStyle = "rgba(246,226,170,0.65)"; c.stroke();

  // body
  c.beginPath();
  c.moveTo(34, -28);
  c.bezierCurveTo(30, -47, 0, -49, -22, -38);
  c.bezierCurveTo(-34, -33, -40, -24, -38, -16);
  c.bezierCurveTo(-30, -2, -4, 4, 14, 0);
  c.bezierCurveTo(28, -4, 36, -14, 34, -28);
  c.closePath();
  const bg = c.createLinearGradient(0, -48, 0, 4);
  bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.65, "#f4f2f0"); bg.addColorStop(1, "#dcd8df");
  inked(c, bg, 1.4);
  // chest feather scallops
  c.strokeStyle = "rgba(35,31,46,0.18)"; c.lineWidth = 0.7;
  c.beginPath();
  for (let i = 0; i < 4; i++) { const yy = -24 + i * 5; c.moveTo(26 - i * 2, yy); c.quadraticCurveTo(29 - i * 2, yy + 2, 26 - i * 2, yy + 4); }
  c.stroke();

  // folded wing over body
  c.beginPath();
  c.moveTo(22, -36);
  c.bezierCurveTo(10, -44, -14, -40, -28, -30);
  c.bezierCurveTo(-40, -24, -50, -18, -56, -14);
  c.bezierCurveTo(-40, -10, -18, -8, 0, -12);
  c.bezierCurveTo(12, -15, 20, -24, 22, -36);
  c.closePath();
  inked(c, "#e4e5ea", 1.3);
  // black flight feathers along the trailing edge
  c.save(); c.clip();
  for (let i = 0; i < 6; i++) {
    const fx = -54 + i * 7.5;
    c.beginPath(); c.ellipse(fx, -12.5 + i * 0.2, 7.5, 3.2, -0.12, 0, TAU);
    c.fillStyle = i % 2 ? "#2b2735" : "#3a3546"; c.fill();
  }
  c.restore();
  c.strokeStyle = "rgba(35,31,46,0.25)"; c.lineWidth = 0.7;
  c.beginPath();
  for (let i = 0; i < 4; i++) { const fx = 8 - i * 9; c.moveTo(fx, -30 + i * 1.2); c.quadraticCurveTo(fx - 4, -24 + i, fx - 9, -22 + i * 1.5); }
  c.stroke();

  // scarf knot around neck
  const kx = 28, ky = -52;
  c.save(); c.translate(kx, ky); c.rotate(0.35);
  c.beginPath(); c.ellipse(0, 0, 9, 4.2, 0, 0, TAU);
  inked(c, "#d8423a", 1.2);
  c.save(); c.clip();
  c.fillStyle = "#f7ecd6";
  for (let s = -8; s < 10; s += 5) c.fillRect(s, -5, 2.2, 10);
  c.restore();
  c.restore();
  scarfAnchor = cap(c, kx - 6, ky + 2);
  // scarf tails (screen-space cloth)
  c.save();
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScarf(c);
  c.restore();
  c.beginPath(); c.ellipse(kx - 6, ky + 2, 3.2, 3, 0, 0, TAU); inked(c, "#c3352f", 1);

  // near wing reaching the handlebar
  wingArm(c, G, false);

  // head
  drawHead(c, HX, HY);
  c.restore();

  // near leg, crank, foot (bike frame)
  crankArm(c, pNear);
  drawLeg(c, hip, pNear, false);
}

function wingArm(c, G, far) {
  const sx = 16, sy2 = -32;
  const dx = G[0] - sx, dy = G[1] - sy2, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  c.beginPath();
  c.moveTo(sx - nx * 8 - ux * 4, sy2 - ny * 8 - uy * 4);
  c.quadraticCurveTo(sx + dx * 0.55 - nx * 6.5, sy2 + dy * 0.55 - ny * 6.5, G[0] - ux * 3 - nx * 3.6, G[1] - uy * 3 - ny * 3.6);
  c.lineTo(G[0] - ux * 3 + nx * 3.6, G[1] - uy * 3 + ny * 3.6);
  c.quadraticCurveTo(sx + dx * 0.5 + nx * 7, sy2 + dy * 0.5 + ny * 7, sx + nx * 9, sy2 + ny * 9);
  c.closePath();
  inked(c, far ? "#b9bcc7" : "#eceef2", 1.3);
  if (!far) {
    c.strokeStyle = "rgba(35,31,46,0.25)"; c.lineWidth = 0.7;
    c.beginPath();
    for (let t = 0.3; t < 0.85; t += 0.18) {
      const px = sx + dx * t, py = sy2 + dy * t;
      c.moveTo(px + nx * 5, py + ny * 5); c.lineTo(px + nx * 1 + ux * 4, py + ny * 1 + uy * 4);
    }
    c.stroke();
  }
  // primary feathers curling round the grip
  c.save(); c.translate(G[0], G[1]); c.rotate(Math.atan2(uy, ux));
  const fc = far ? "#2a2633" : "#332e3e";
  [[-0.9, 6.5], [-0.3, 7.5], [0.35, 7], [0.95, 5.5]].forEach(([a, len]) => {
    c.save(); c.rotate(a * 0.9);
    c.beginPath(); c.ellipse(len * 0.45, 0, len * 0.6, 1.9, 0, 0, TAU);
    c.fillStyle = fc; c.fill(); c.lineWidth = 0.7; c.strokeStyle = INK; c.stroke();
    c.restore();
  });
  c.restore();
}

function drawScarf(c) {
  scarf.tails.forEach((tail, k) => {
    if (tail.length < 2) return;
    const w0 = (k ? 5.2 : 6.2) * S;
    c.lineCap = "round"; c.lineJoin = "round";
    c.beginPath(); c.moveTo(tail[0].x, tail[0].y);
    for (let i = 1; i < tail.length; i++) c.lineTo(tail[i].x, tail[i].y);
    c.lineWidth = w0 + 2.4 * S * 0.6; c.strokeStyle = INK; c.stroke();
    for (let i = 0; i < tail.length - 1; i++) {
      const a = tail[i], b = tail[i + 1];
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y);
      c.lineWidth = w0 * (1 - i / tail.length * 0.25);
      c.lineCap = "butt";
      c.strokeStyle = (i + k) % 3 === 2 ? "#f7ecd6" : (k ? "#c3352f" : "#d8423a");
      c.stroke();
    }
    // fringe
    const e = tail[tail.length - 1], p = tail[tail.length - 2];
    const dx = e.x - p.x, dy = e.y - p.y, L = Math.hypot(dx, dy) || 1;
    c.strokeStyle = "#f7ecd6"; c.lineWidth = 0.9 * S; c.lineCap = "round";
    c.beginPath();
    for (let f = -1; f <= 1; f++) {
      const ox = e.x - dy / L * f * w0 * 0.35, oy = e.y + dx / L * f * w0 * 0.35;
      c.moveTo(ox, oy); c.lineTo(ox + dx / L * 3.5 * S, oy + dy / L * 3.5 * S + Math.sin(time * 20 + f) * S);
    }
    c.stroke();
  });
}

function drawHead(c, HX, HY) {
  c.save();
  c.translate(HX, HY);
  const nod = Math.sin(time * 1.3) * 0.03 + pouch.y * 0.006;
  c.rotate(-lean * 0.75 + nod);
  const e = Math.max(0, 1 - (time - bellT) / 0.8);
  const open = time - bellT < 0.8 ? 0.34 * Math.sin(Math.min(1, (time - bellT) * 8) * Math.PI / 2) * e : 0;
  const j = pouch.y;
  const flutter = Math.sin(time * 16) * 0.12 * (v / 400) + Math.sin(time * 5) * 0.05;

  // crest feathers
  c.lineCap = "round";
  [[-0.2, 13], [0.15, 11], [0.45, 9]].forEach(([a, len], i) => {
    const ang = Math.PI + a + flutter * (1 + i * 0.4);
    c.beginPath(); c.moveTo(-7, -6);
    c.quadraticCurveTo(-7 + Math.cos(ang) * len * 0.6, -6 + Math.sin(ang) * len * 0.6 - 3, -7 + Math.cos(ang) * len, -6 + Math.sin(ang) * len);
    c.lineWidth = 3.6; c.strokeStyle = INK; c.stroke();
    c.lineWidth = 2; c.strokeStyle = "#fff6dc"; c.stroke();
  });

  // pouch
  c.beginPath();
  c.moveTo(62, 11);
  c.lineTo(10, 3.5);
  c.quadraticCurveTo(2, 6, 1, 12);
  c.bezierCurveTo(10, 26 + j * 1.3, 44, 25 + j * 0.9, 62, 11);
  c.closePath();
  const pg = c.createLinearGradient(0, 4, 0, 26);
  pg.addColorStop(0, "#f7c060"); pg.addColorStop(1, "#e7893a");
  inked(c, pg, 1.3);
  c.strokeStyle = "rgba(160,80,30,0.35)"; c.lineWidth = 0.8;
  c.beginPath(); c.moveTo(12, 12 + j * 0.4); c.quadraticCurveTo(30, 18 + j * 0.9, 50, 13 + j * 0.3); c.stroke();
  c.fillStyle = "rgba(255,240,200,0.45)";
  c.beginPath(); c.ellipse(28, 11 + j * 0.5, 9, 2, 0.08, 0, TAU); c.fill();

  // head
  c.beginPath(); c.ellipse(0, 0, 12.5, 11, 0, 0, TAU);
  const hg = c.createLinearGradient(0, -11, 0, 11);
  hg.addColorStop(0, "#fff2cf"); hg.addColorStop(0.5, "#ffffff"); hg.addColorStop(1, "#f3f1ee");
  inked(c, hg, 1.4);
  // facial skin + eye
  c.beginPath(); c.ellipse(5.5, -2, 5.4, 4.4, 0.2, 0, TAU); c.fillStyle = "#f6bfad"; c.fill();
  const blinking = time - blinkT < 0.13;
  if (blinking) {
    c.strokeStyle = INK; c.lineWidth = 1.1;
    c.beginPath(); c.moveTo(3, -2); c.quadraticCurveTo(5.8, -0.6, 8.6, -2); c.stroke();
  } else {
    c.beginPath(); c.arc(5.8, -2.4, 2.7, 0, TAU); c.fillStyle = "#fdf0b4"; c.fill();
    c.lineWidth = 0.7; c.strokeStyle = INK; c.stroke();
    c.beginPath(); c.arc(6.4, -2.3, 1.35, 0, TAU); c.fillStyle = "#1b1720"; c.fill();
    c.beginPath(); c.arc(6.9, -2.9, 0.5, 0, TAU); c.fillStyle = "#fff"; c.fill();
  }

  // lower mandible
  c.beginPath(); c.moveTo(9, 4); c.lineTo(62, 11.2);
  c.lineCap = "round"; c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
  c.lineWidth = 1.6; c.strokeStyle = "#e48a35"; c.stroke();

  // mouth interior when the beak opens
  if (open > 0.01) {
    const tip = rot(62 - 9, 11 - 0, -open);
    c.beginPath(); c.moveTo(9, 2); c.lineTo(62, 10.6); c.lineTo(9 + tip[0], 0 + tip[1]); c.closePath();
    c.fillStyle = "#a63f32"; c.fill();
  }

  // upper mandible
  c.save();
  c.translate(9, 0); c.rotate(-open); c.translate(-9, 0);
  c.beginPath();
  c.moveTo(6, -5.5);
  c.bezierCurveTo(24, -8.5, 46, -3, 63, 6);
  c.bezierCurveTo(67.5, 7.6, 67, 12, 62.4, 11.6);
  c.bezierCurveTo(44, 7.2, 24, 5, 7, 4);
  c.closePath();
  const ug = c.createLinearGradient(0, -8, 0, 10);
  ug.addColorStop(0, "#ffd36c"); ug.addColorStop(1, "#f09a33");
  inked(c, ug, 1.3);
  c.strokeStyle = "rgba(255,255,255,0.55)"; c.lineWidth = 0.9;
  c.beginPath(); c.moveTo(10, -3.6); c.quadraticCurveTo(36, -4, 59, 6.4); c.stroke();
  c.beginPath(); c.moveTo(60.5, 7.2); c.quadraticCurveTo(66.5, 7.6, 63, 11.6); c.lineTo(60.6, 10.6); c.closePath();
  c.fillStyle = "#d5532d"; c.fill();
  c.strokeStyle = INK; c.lineWidth = 0.7;
  c.beginPath(); c.moveTo(12, -2.4); c.lineTo(17, -2.8); c.stroke();
  c.restore();

  bubbleAnchor = cap(c, 20, -16);
  c.restore();
}

function drawForeground(c) {
  const p = 1.18, step = 26;
  const off = X * p;
  const a = Math.floor((off - bikeSX / S - 60) / step), b = Math.ceil((off + (W - bikeSX) / S + 60) / step);
  for (let i = a; i <= b; i++) {
    const hs = hash(i * 2.13);
    if (hs < 0.35) continue;
    const u = i * step + hs * 18;
    const sx = bikeSX + (u - off) * S;
    const roadFront = sy(terrain(wx(sx)) - 23);
    const depth = hash(i * 5.71);
    const y = lerp(roadFront + 10 * S, H + 4, 0.15 + depth * 0.85);
    if (y < roadFront + 6) continue;
    const k = S * (0.8 + depth * 0.7);
    const sway = Math.sin(time * 2.4 + i) * 0.12 + 0.18 * Math.min(1, v / 400);
    c.lineCap = "round";
    c.strokeStyle = depth > 0.5 ? "#3f6c3b" : "#5e8f4a";
    c.lineWidth = 1.7 * k;
    c.beginPath();
    for (let bl = -2; bl <= 2; bl++) {
      const hgt = (10 + hash(i * 3 + bl) * 9) * k;
      c.moveTo(sx + bl * 2.2 * k, y);
      c.quadraticCurveTo(sx + bl * 3 * k, y - hgt * 0.6, sx + bl * 4 * k - sway * hgt, y - hgt);
    }
    c.stroke();
    if (hash(i * 9.3) > 0.72) {
      const fx = sx - sway * 14 * k, fy = y - 15 * k;
      const fcol = ["#fff4e8", "#ffd65a", "#f49ac1"][Math.floor(hash(i * 4.2) * 3)];
      c.fillStyle = fcol;
      for (let pt = 0; pt < 5; pt++) { const ang = pt / 5 * TAU + time * 0.2; c.beginPath(); c.arc(fx + Math.cos(ang) * 2.2 * k, fy + Math.sin(ang) * 2.2 * k, 1.6 * k, 0, TAU); c.fill(); }
      c.fillStyle = "#e08a2e"; c.beginPath(); c.arc(fx, fy, 1.3 * k, 0, TAU); c.fill();
    }
  }
}

/* ---------- render ---------- */
function render() {
  // world layer
  lc.setTransform(DPR, 0, 0, DPR, 0, 0);
  lc.clearRect(0, 0, W, H);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sky = drawSky(ctx);

  const beachTop = drawSea(lc, sky);
  drawBeach(lc, beachTop);
  drawRoad(lc);

  // bike
  lc.save();
  lc.translate(bikeSX, sy(hMid) + state.bumpY * S);
  lc.scale(S, S);
  lc.rotate(-theta);
  drawBike(lc);
  lc.restore();

  // dust
  for (const p of particles) {
    lc.fillStyle = `rgba(226,206,176,${0.55 * p.life / p.max})`;
    lc.beginPath(); lc.arc(p.x, p.y, p.r, 0, TAU); lc.fill();
  }
  drawForeground(lc);
  for (const l of speedLines) {
    lc.strokeStyle = `rgba(255,255,255,${0.35 * l.life})`; lc.lineWidth = 1.4;
    lc.beginPath(); lc.moveTo(l.x, l.y); lc.lineTo(l.x + l.len, l.y); lc.stroke();
  }

  // grade the world: warm sunset rim + night tint
  lc.globalCompositeOperation = "source-atop";
  const wg = lc.createLinearGradient(W, 0, 0, 0);
  wg.addColorStop(0, `rgba(255,170,100,${0.16 * (1 - night)})`); wg.addColorStop(1, "rgba(255,170,100,0)");
  lc.fillStyle = wg; lc.fillRect(0, 0, W, H);
  if (night > 0.001) { lc.fillStyle = `rgba(16,22,70,${0.62 * night})`; lc.fillRect(0, 0, W, H); }
  lc.globalCompositeOperation = "source-over";

  ctx.drawImage(layer, 0, 0, W, H);

  // night lights
  if (night > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = night;
    for (const g of glows) {
      const r = 70 * S;
      const rg = ctx.createRadialGradient(g.x, g.y, 2, g.x, g.y, r);
      rg.addColorStop(0, `rgba(255,214,140,${0.75 * a})`); rg.addColorStop(1, "rgba(255,180,90,0)");
      ctx.fillStyle = rg; ctx.fillRect(g.x - r, g.y - r, r * 2, r * 2);
      const cg = ctx.createLinearGradient(0, g.y, 0, g.ground);
      cg.addColorStop(0, `rgba(255,200,120,${0.22 * a})`); cg.addColorStop(1, `rgba(255,200,120,${0.05 * a})`);
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.moveTo(g.x - 5 * S, g.y); ctx.lineTo(g.x + 5 * S, g.y);
      ctx.lineTo(g.x + 46 * S, g.ground); ctx.lineTo(g.x - 46 * S, g.ground); ctx.closePath(); ctx.fill();
      const pg = ctx.createRadialGradient(g.x, g.ground, 1, g.x, g.ground, 50 * S);
      pg.addColorStop(0, `rgba(255,200,130,${0.25 * a})`); pg.addColorStop(1, "rgba(255,200,130,0)");
      ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(g.x, g.ground, 50 * S, 10 * S, 0, 0, TAU); ctx.fill();
    }
    if (headlight) {
      const { p, q, g } = headlight;
      const bg = ctx.createLinearGradient(p.x, p.y, q.x, q.y);
      bg.addColorStop(0, `rgba(255,244,205,${0.5 * a})`); bg.addColorStop(1, "rgba(255,244,205,0)");
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.moveTo(p.x, p.y - 2 * S);
      ctx.lineTo(q.x, q.y - 50 * S); ctx.lineTo(g.x, g.y + 14 * S); ctx.lineTo(p.x, p.y + 2 * S); ctx.closePath(); ctx.fill();
      const hg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 14 * S);
      hg.addColorStop(0, `rgba(255,250,220,${0.9 * a})`); hg.addColorStop(1, "rgba(255,250,220,0)");
      ctx.fillStyle = hg; ctx.fillRect(p.x - 14 * S, p.y - 14 * S, 28 * S, 28 * S);
    }
    if (taillight) {
      const blink = 0.55 + 0.45 * (Math.sin(time * 6) > 0 ? 1 : 0.2);
      const tg = ctx.createRadialGradient(taillight.x, taillight.y, 0, taillight.x, taillight.y, 12 * S);
      tg.addColorStop(0, `rgba(255,70,60,${0.8 * a * blink})`); tg.addColorStop(1, "rgba(255,70,60,0)");
      ctx.fillStyle = tg; ctx.fillRect(taillight.x - 12 * S, taillight.y - 12 * S, 24 * S, 24 * S);
    }
    // moon path on the water
    for (let i = 0; i < 18; i++) {
      const t = i / 18, yy = lerp(horizonY + 3, beachTop, t);
      const spread = lerp(5, 40, t) * Math.max(0.7, S * 0.6);
      const jitter = Math.sin(time * 2.4 + i * 2.1) * spread * 0.4;
      ctx.fillStyle = `rgba(200,210,255,${(0.35 - t * 0.15) * a})`;
      ctx.fillRect(sky.moonX + jitter - spread * 0.3, yy, spread * 0.6, 1.4);
    }
    ctx.restore();
  }

  // speech bubble
  const bt = time - bellT;
  if (bubbleAnchor && bt < 1.5) {
    const al = Math.min(1, bt * 8) * Math.min(1, (1.5 - bt) * 4);
    const pop = 0.85 + 0.15 * Math.min(1, bt * 6);
    const fs = Math.round(clamp(15 * S * 0.75, 15, 26));
    ctx.save();
    ctx.globalAlpha = al;
    ctx.font = `${fs}px ${DISPLAY_FONT}`;
    const tw = ctx.measureText(bellText).width;
    const bw = tw + fs * 1.2, bh = fs * 1.8;
    const bx = bubbleAnchor.x + 6 * S, byy = bubbleAnchor.y - bh - 18 * S;
    ctx.translate(bx + bw / 2, byy + bh / 2); ctx.scale(pop, pop); ctx.translate(-(bx + bw / 2), -(byy + bh / 2));
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, byy, bw, bh, bh / 2); else ctx.rect(bx, byy, bw, bh);
    ctx.moveTo(bx + bw * 0.22, byy + bh - 1);
    ctx.lineTo(bubbleAnchor.x, bubbleAnchor.y - 2);
    ctx.lineTo(bx + bw * 0.4, byy + bh - 1);
    ctx.fillStyle = "#fffaf0"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = "#fffaf0";
    ctx.fillRect(bx + bw * 0.22 + 1, byy + bh - 3, bw * 0.18 - 2, 4);
    ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(bellText, bx + bw / 2, byy + bh / 2 + 1);
    ctx.restore();
  }
}

/* ---------- HUD + controls ---------- */
const spdEl = document.getElementById("spd"), dstEl = document.getElementById("dst"), terEl = document.getElementById("terrainLabel");
const speedInput = document.getElementById("speed");
const nightBtn = document.getElementById("nightBtn"), pauseBtn = document.getElementById("pauseBtn"), bellBtn = document.getElementById("bellBtn");
let hudT = 0;
function updateHud() {
  spdEl.textContent = Math.round(v * 0.0612);
  dstEl.textContent = ((X - 140) * 0.017 / 1000).toFixed(2);
  terEl.textContent = slope > 0.05 ? "上坡 · 用力蹬" : slope < -0.07 ? "下坡 · 滑行中" : "平路";
}
function setNight(on) {
  nightTarget = on ? 1 : 0;
  nightBtn.setAttribute("aria-pressed", String(on));
  if (paused) { night = nightTarget; render(); }
}
function setPaused(p) {
  paused = p;
  pauseBtn.textContent = p ? "继续" : "暂停";
  if (!p) last = performance.now();
}
speedInput.addEventListener("input", () => { speedLevel = +speedInput.value; });
speedInput.value = speedLevel;
bellBtn.addEventListener("click", ringBell);
nightBtn.addEventListener("click", () => setNight(nightTarget < 0.5));
pauseBtn.addEventListener("click", () => setPaused(!paused));
cvs.addEventListener("pointerdown", ringBell);
window.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (e.key === " " && tag !== "BUTTON" && tag !== "INPUT") { e.preventDefault(); ringBell(); }
  else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && tag !== "INPUT") {
    speedLevel = clamp(speedLevel + (e.key === "ArrowRight" ? 1 : -1), 1, 10);
    speedInput.value = speedLevel;
  } else if (e.key === "n" || e.key === "N") setNight(nightTarget < 0.5);
  else if (e.key === "p" || e.key === "P") setPaused(!paused);
});
nightBtn.setAttribute("aria-pressed", String(nightTarget > 0.5));
pauseBtn.textContent = paused ? "继续" : "暂停";

window.addEventListener("resize", () => { resize(); if (paused) render(); });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
  last = now;
  night += (nightTarget - night) * Math.min(1, dt * 1.6);
  if (!paused) update(dt);
  render();
  hudT += dt;
  if (hudT > 0.2) { hudT = 0; updateHud(); }
  requestAnimationFrame(frame);
}

DISPLAY_FONT = getComputedStyle(document.documentElement).getPropertyValue("--font-display").trim() || DISPLAY_FONT;
resize();
// warm up so the first frame is already in motion (scarf settled, speed reached)
v = 90 + speedLevel * 44;
for (let i = 0; i < 90; i++) { render(); update(1 / 60); }
updateHud();
document.fonts && document.fonts.ready.then(() => { if (paused) render(); });
requestAnimationFrame(frame);
})();
</script>
